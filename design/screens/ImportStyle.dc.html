<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a look for the story</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E8B44C}a:hover{color:#F3CD7A}
input[type=color]{-webkit-appearance:none;appearance:none;padding:0;border:none;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid #3A3548;border-radius:2px}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; padding: 20px 20px 28px; background: #15131C; color: #EDE8F5; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Import.dc.html" aria-label="Back to file check" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: #201D29; border: 2px solid #2E2A3A; border-radius: 4px; color: #EDE8F5">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
</a>
<div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
<h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 500; letter-spacing: 1px">CHOOSE A LOOK</h1>
<span style="font-size: 12px; color: #A79FB8">Saltmarsh Wake · step 2 of 2</span>
</div>
</div>

<figure aria-label="Preview of the story in this look" style="margin: 0; display: flex; flex-direction: column; background: {{t.bg}}; border: 2px solid {{t.panel}}; border-radius: 6px; overflow: hidden">
<svg viewBox="0 0 64 20" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" aria-hidden="true" style="display: block; width: 100%; height: 84px">
<rect x="0" y="0" width="64" height="20" fill="#2C4A50"></rect>
<rect x="0" y="0" width="64" height="6" fill="#3D6468"></rect>
<rect x="50" y="2" width="4" height="4" fill="#DDE8D8"></rect>
<rect x="0" y="11" width="64" height="9" fill="#1C3438"></rect>
<rect x="6" y="8" width="2" height="5" fill="#5A6B4A"></rect>
<rect x="10" y="9" width="1" height="4" fill="#5A6B4A"></rect>
<rect x="44" y="8" width="2" height="5" fill="#5A6B4A"></rect>
<rect x="28" y="5" width="6" height="8" fill="#141E22"></rect>
<rect x="30" y="3" width="2" height="2" fill="#141E22"></rect>
<rect x="30" y="7" width="2" height="2" fill="#E8B44C"></rect>
</svg>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px">
<p style="margin: 0; font-family: {{t.font}}; font-size: 15px; line-height: 1.55; color: {{t.text}}">The bell rings again under the black water. Dana grips the rail of the punt.</p>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: {{t.accent}}">DANA</span>
<p style="margin: 0; font-family: {{t.font}}; font-size: 15px; line-height: 1.55; color: {{t.text}}">“It’s getting closer. Or we are.”</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 10px; background: {{t.panel}}; border: 2px solid {{t.accent}}; border-radius: 4px; font-size: 14px; color: {{t.text}}">
<span style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: {{t.accent}}; color: {{t.onAccent}}; font-family: 'Pixelify Sans', monospace; font-size: 13px">A</span>
Row toward the sound
</div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 10px; background: {{t.panel}}; border: 2px solid {{t.panel}}; border-radius: 4px; font-size: 14px; color: {{t.text}}">
<span style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}; color: {{t.text}}; font-family: 'Pixelify Sans', monospace; font-size: 13px">B</span>
Turn the punt for shore
</div>
</div>
<div style="display: flex; align-items: center; justify-content: center; height: 40px; background: {{t.accent}}; color: {{t.onAccent}}; border-radius: 4px; font-size: 14px; font-weight: 600">Continue</div>
</div>
</figure>

<div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 6px 6px 12px; background: #201D29; border: 2px solid {{authorBorder}}; border-radius: 4px">
<span aria-hidden="true" style="display: flex; flex: none">
<sc-for list="{{authorDots}}" as="d" hint-placeholder-count="4">
<span style="width: 12px; height: 24px; background: {{d}}"></span>
</sc-for>
</span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 13px; font-weight: 600">Author’s look: Tide</span>
<span style="font-size: 12px; color: #A79FB8">Set in the story file by Dana R.</span>
</span>
<button onClick="{{useAuthor}}" aria-pressed="{{authorPressed}}" style="height: 36px; padding: 0 10px; background: {{authorBtnBg}}; border: 2px solid #3A3548; border-radius: 2px; color: {{authorBtnFg}}; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer">{{authorBtnLabel}}</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 15px; font-weight: 500; letter-spacing: 1px">PRESETS</h2>
<div role="radiogroup" aria-label="Color presets" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="6">
<button role="radio" aria-checked="{{p.checked}}" onClick="{{p.pick}}" style="display: flex; flex-direction: column; gap: 6px; padding: 8px; background: {{p.bg}}; border: 2px solid {{p.ring}}; border-radius: 4px; cursor: pointer; font-family: inherit; text-align: left">
<span aria-hidden="true" style="display: flex; height: 18px">
<span style="flex: 1; background: {{p.panel}}"></span>
<span style="flex: 1; background: {{p.text}}"></span>
<span style="flex: 1; background: {{p.accent}}"></span>
</span>
<span style="font-size: 12px; font-weight: 600; color: {{p.text}}">{{p.name}}</span>
<span style="font-size: 11px; color: {{p.text}}; opacity: 0.8">{{p.tone}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 15px; font-weight: 500; letter-spacing: 1px">YOUR COLORS</h2>
<span style="font-size: 12px; color: #A79FB8">{{customHint}}</span>
</div>
<sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
<label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px 0 12px; background: #1C1925; border: 2px solid #2E2A3A; border-radius: 4px; cursor: pointer">
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 500">{{r.label}}</span>
<span style="font-size: 11px; color: #A79FB8">{{r.help}}</span>
</span>
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #C9C2D8">{{r.value}}</span>
<input type="color" value="{{r.value}}" onChange="{{r.change}}" aria-label="{{r.label}} color" style="width: 40px; height: 32px">
</label>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 15px; font-weight: 500; letter-spacing: 1px">STORY TEXT</h2>
<div role="radiogroup" aria-label="Story text style" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #201D29; border: 2px solid #2E2A3A; border-radius: 4px">
<sc-for list="{{fonts}}" as="f" hint-placeholder-count="3">
<button role="radio" aria-checked="{{f.checked}}" onClick="{{f.pick}}" style="height: 40px; border: none; border-radius: 2px; background: {{f.bg}}; color: {{f.fg}}; font-family: {{f.family}}; font-size: 15px; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
</div>

<div role="status" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: #1C1925; border: 2px solid {{check.border}}; border-radius: 4px; font-size: 13px; line-height: 1.45">
<span aria-hidden="true" style="width: 10px; height: 10px; margin-top: 5px; flex: none; background: {{check.color}}"></span>
<span><strong style="color: {{check.color}}">{{check.title}}</strong> {{check.text}}</span>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; background: #E8B44C; color: #15131C; text-decoration: none; border-radius: 4px; box-shadow: 0 4px 0 #8A6420; font-size: 16px; font-weight: 600">Add to library with this look</a>
<span style="font-size: 12px; color: #A79FB8; text-align: center">You can change it later from the story’s menu in the library.</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'tide', custom: null, font: 'serif' };
  }
  renderVals() {
    const PRESETS = [
      { id: 'dusk', name: 'Dusk', tone: 'Quiet, eerie', bg: '#15131C', panel: '#201D29', text: '#EDE8F5', accent: '#E8B44C' },
      { id: 'tide', name: 'Tide', tone: 'Cold, watery', bg: '#0F1E24', panel: '#17303A', text: '#E3F1F0', accent: '#5CC8B4' },
      { id: 'ember', name: 'Ember', tone: 'Tense, violent', bg: '#1E1110', panel: '#2E1A17', text: '#F5E6DC', accent: '#E2725B' },
      { id: 'moss', name: 'Moss', tone: 'Old, wild', bg: '#141A12', panel: '#1F2A1C', text: '#E6EEDC', accent: '#A8C66C' },
      { id: 'parchment', name: 'Parchment', tone: 'Warm, storybook', bg: '#F2E8D5', panel: '#E6D8BC', text: '#2B2118', accent: '#8A4B2A' },
      { id: 'frost', name: 'Frost', tone: 'Clear, bright', bg: '#EEF2F6', panel: '#DCE4EC', text: '#1B2430', accent: '#3D6FB0' }
    ];
    const AUTHOR = 'tide';
    const lum = (h) => {
      const c = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255)
        .map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
      return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    };
    const ratio = (a, b) => {
      const x = lum(a), y = lum(b);
      return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
    };
    const base = PRESETS.find((p) => p.id === this.state.pick) || PRESETS[1];
    const cur = this.state.pick === 'custom' && this.state.custom ? this.state.custom : base;
    const FONTS = {
      serif: "'Literata', Georgia, serif",
      sans: "'IBM Plex Sans', system-ui, sans-serif",
      pixel: "'Pixelify Sans', monospace"
    };
    const t = {
      bg: cur.bg, panel: cur.panel, text: cur.text, accent: cur.accent,
      onAccent: ratio('#15131C', cur.accent) >= ratio('#FFFFFF', cur.accent) ? '#15131C' : '#FFFFFF',
      font: FONTS[this.state.font]
    };

    const presets = PRESETS.map((p) => {
      const sel = this.state.pick === p.id;
      return { ...p, checked: String(sel), ring: sel ? '#E8B44C' : '#2E2A3A', pick: () => this.setState({ pick: p.id, custom: null }) };
    });

    const setRole = (key, value) => {
      const next = { ...cur, [key]: value };
      this.setState({ pick: 'custom', custom: next });
    };
    const roles = [
      { key: 'bg', label: 'Background', help: 'Behind the story' },
      { key: 'panel', label: 'Panels', help: 'Choices, note boxes' },
      { key: 'text', label: 'Text', help: 'Story and choices' },
      { key: 'accent', label: 'Accent', help: 'Names, buttons, highlights' }
    ].map((r) => ({ ...r, value: cur[r.key].toUpperCase(), change: (e) => setRole(r.key, e.target.value) }));

    const fonts = [
      { id: 'serif', label: 'Book' },
      { id: 'sans', label: 'Clean' },
      { id: 'pixel', label: 'Pixel' }
    ].map((f) => {
      const sel = this.state.font === f.id;
      return { ...f, family: FONTS[f.id], checked: String(sel), bg: sel ? '#E8B44C' : 'transparent', fg: sel ? '#15131C' : '#C9C2D8', pick: () => this.setState({ font: f.id }) };
    });

    const textR = ratio(cur.text, cur.bg);
    const accR = ratio(cur.accent, cur.bg);
    let check;
    if (textR < 4.5) {
      check = { title: 'Hard to read.', text: 'Text on background is ' + textR.toFixed(1) + ':1. The app will adjust the text color until it reaches 4.5:1.', color: '#E2725B', border: '#7A3B33' };
    } else if (accR < 3) {
      check = { title: 'Accent is faint.', text: 'Names and highlights are ' + accR.toFixed(1) + ':1 against the background. Try a brighter or darker accent.', color: '#E8B44C', border: '#8A6420' };
    } else {
      check = { title: 'Easy to read.', text: 'Text ' + textR.toFixed(1) + ':1, accent ' + accR.toFixed(1) + ':1 against the background.', color: '#5CC8B4', border: '#2A4440' };
    }

    const isAuthor = this.state.pick === AUTHOR;
    const author = PRESETS.find((p) => p.id === AUTHOR);
    return {
      t, presets, roles, fonts, check,
      authorDots: [author.bg, author.panel, author.text, author.accent],
      authorBorder: isAuthor ? '#5CC8B4' : '#2E2A3A',
      authorPressed: String(isAuthor),
      authorBtnLabel: isAuthor ? 'In use' : 'Use it',
      authorBtnBg: isAuthor ? 'transparent' : '#E8B44C',
      authorBtnFg: isAuthor ? '#A79FB8' : '#15131C',
      useAuthor: () => this.setState({ pick: AUTHOR, custom: null, font: 'serif' }),
      customHint: this.state.pick === 'custom' ? 'Custom look' : 'Edit any color to customize'
    };
  }
}
</script>
</body>
</html>
