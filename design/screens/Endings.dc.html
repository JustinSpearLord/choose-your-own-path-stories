<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Endings found</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5CC8B4}a:hover{color:#8FE0D0}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; padding: 16px 20px 28px; background: #0F1E24; color: #E3F1F0; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px">
<a href="StoryMenu.dc.html" aria-label="Back to story menu" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: #17303A; border: 2px solid #24434F; border-radius: 4px; color: #E3F1F0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
</a>
<div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
<h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 20px; font-weight: 500">Endings</h1>
<span style="font-size: 12px; color: #9DB8B6">Saltmarsh Wake</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #17303A; border-radius: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: 'Pixelify Sans', monospace; font-size: 30px; color: #5CC8B4">2 / 3</span>
<span style="font-size: 13px; color: #9DB8B6">endings found</span>
</div>
<div role="img" aria-label="2 of 3 endings found" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<span style="height: 10px; background: #5CC8B4"></span>
<span style="height: 10px; background: #5CC8B4"></span>
<span style="height: 10px; background: #24434F"></span>
</div>
</div>

<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{endings}}" as="e" hint-placeholder-count="3">
<li style="display: flex; flex-direction: column; background: #17303A; border: 2px solid {{e.border}}; border-radius: 6px; overflow: hidden">
<sc-if value="{{e.found}}" hint-placeholder-val="{{ true }}">
<div style="height: 72px; background: {{e.sky}}; box-shadow: inset 0 -26px 0 {{e.ground}}, inset 0 -32px 0 {{e.horizon}}; position: relative">
<span aria-hidden="true" style="position: absolute; left: {{e.markX}}px; bottom: 26px; width: 12px; height: 18px; background: #0B1418"></span>
<span aria-hidden="true" style="position: absolute; left: {{e.lightX}}px; top: 12px; width: 10px; height: 10px; background: #E3F1F0"></span>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Literata', Georgia, serif; font-size: 17px">{{e.title}}</span>
<span style="font-size: 12px; color: #9DB8B6">{{e.meta}}</span>
</span>
<a href="Review.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; background: #0F1E24; border: 2px solid #24434F; border-radius: 2px; color: #E3F1F0; text-decoration: none; font-size: 13px; font-weight: 600">Review path</a>
</div>
</sc-if>
<sc-if value="{{e.locked}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 12px">
<span aria-hidden="true" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border: 2px dashed #4C6A70; font-family: 'Pixelify Sans', monospace; font-size: 20px; color: #9DB8B6">?</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Not found yet</span>
<span style="font-size: 12px; color: #9DB8B6">Title hidden until you reach it</span>
</span>
</div>
</sc-if>
</li>
</sc-for>
</ul>

<a href="Map.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; background: #5CC8B4; color: #0F1E24; text-decoration: none; border-radius: 4px; box-shadow: 0 4px 0 #2F7A6C; font-size: 16px; font-weight: 600">See where the branches split</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      endings: [
        { found: true, locked: false, title: 'The Drowned Bell', meta: 'Good ending · found Nov 6 · 14 choices', border: '#5CC8B4', sky: '#2C4A50', horizon: '#3D6468', ground: '#1C3438', markX: 170, lightX: 280 },
        { found: true, locked: false, title: 'Leave by Dawn', meta: 'Neutral ending · found Nov 5 · 9 choices', border: '#24434F', sky: '#4E6A72', horizon: '#C9B98F', ground: '#22343A', markX: 90, lightX: 60 },
        { found: false, locked: true, title: '', meta: '', border: '#24434F', sky: '', horizon: '', ground: '', markX: 0, lightX: 0 }
      ]
    };
  }
}
</script>
</body>
</html>
