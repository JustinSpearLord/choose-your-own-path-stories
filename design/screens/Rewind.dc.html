<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rewind to a decision</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E8B44C}a:hover{color:#F3CD7A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 900px; box-sizing: border-box; background: #15131C; color: #EDE8F5; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">

<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px; opacity: 0.35">
<span style="font-family: 'Pixelify Sans', monospace; font-size: 20px">Stealth run</span>
<div style="height: 40px; background: #201D29; border-radius: 4px"></div>
<div style="height: 120px; background: #1C1925; border-radius: 4px"></div>
<div style="height: 160px; background: #1C1925; border-radius: 4px"></div>
<div style="height: 120px; background: #1C1925; border-radius: 4px"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8,7,12,0.6)"></div>

<div role="dialog" aria-label="Rewind to scene 9" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px; padding: 12px 20px 28px; background: #1C1925; border-top: 2px solid #3A3548; border-radius: 12px 12px 0 0">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; background: #4A4458; border-radius: 2px"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Pixelify Sans', monospace; font-size: 13px; letter-spacing: 2px; color: #E8B44C">REWIND</span>
<h1 style="margin: 0; font-family: 'Literata', Georgia, serif; font-size: 22px; font-weight: 500; line-height: 1.3">Go back to Scene 9 · Ferry crossing?</h1>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #C9C2D8">You’ll make this decision again and play on from there. Nothing is lost.</p>

<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 12px; background: #201D29; border: 2px solid {{o.border}}; border-radius: 4px; font-size: 14px">
<span aria-hidden="true" style="font-family: 'Pixelify Sans', monospace; width: 14px">{{o.key}}</span>
<span style="flex: 1">{{o.text}}</span>
<span style="font-size: 11px; color: {{o.tagColor}}">{{o.tag}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: #201D29; border-radius: 4px; font-size: 13px; line-height: 1.45; color: #D6D0E2">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8B44C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline></svg>
<span>“Stealth run” stays saved as it is, with its 5 notes. The new run starts with your choices and notes up to Scene 9.</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="Review.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; background: #201D29; border: 2px solid #3A3548; border-radius: 4px; color: #EDE8F5; text-decoration: none; font-size: 15px; font-weight: 600">Cancel</a>
<a href="Choice.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; background: #E8B44C; color: #15131C; text-decoration: none; border-radius: 4px; box-shadow: 0 4px 0 #8A6420; font-size: 15px; font-weight: 600">Rewind</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      opts: [
        { key: 'A', text: 'Land the ferry at the jetty', tag: 'new', tagColor: '#A79FB8', border: '#2E2A3A' },
        { key: 'B', text: 'Douse your lantern and drift in', tag: 'chosen last time', tagColor: '#E8B44C', border: '#8A6420' },
        { key: 'C', text: 'Make Maddox tell you what he knows', tag: 'new', tagColor: '#A79FB8', border: '#2E2A3A' }
      ]
    };
  }
}
</script>
</body>
</html>
