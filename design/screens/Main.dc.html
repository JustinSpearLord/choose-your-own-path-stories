<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quest Journal library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E8B44C}a:hover{color:#F3CD7A}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; padding: 24px 20px; background: #15131C; color: #EDE8F5; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 28px; font-weight: 700; letter-spacing: 1px; color: {{accent}}">QUEST JOURNAL</h1>
<p style="margin: 0; font-size: 13px; color: #A79FB8">Play stories, choose your path, keep notes</p>
</div>
<a href="Settings.dc.html" aria-label="Settings and backup" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: #201D29; border: 2px solid #2E2A3A; border-radius: 4px; color: #EDE8F5">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
</a>
</div>

<div style="background: #201D29; border: 2px solid #2E2A3A; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column">
<svg viewBox="0 0 64 36" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" role="img" aria-label="Pixel art scene: a lantern road at dusk" style="display: block; width: 100%; height: 112px">
<rect x="0" y="0" width="64" height="36" fill="#2A2342"></rect>
<rect x="0" y="12" width="64" height="8" fill="#3A2E55"></rect>
<rect x="0" y="20" width="64" height="6" fill="#4D3A63"></rect>
<rect x="48" y="5" width="5" height="5" fill="#F3E3B0"></rect>
<rect x="49" y="4" width="3" height="7" fill="#F3E3B0"></rect>
<rect x="8" y="4" width="1" height="1" fill="#EDE8F5"></rect>
<rect x="17" y="8" width="1" height="1" fill="#EDE8F5"></rect>
<rect x="30" y="3" width="1" height="1" fill="#EDE8F5"></rect>
<rect x="40" y="9" width="1" height="1" fill="#EDE8F5"></rect>
<rect x="0" y="20" width="10" height="16" fill="#2B2440"></rect>
<rect x="6" y="17" width="8" height="19" fill="#2B2440"></rect>
<rect x="12" y="14" width="6" height="22" fill="#2B2440"></rect>
<rect x="18" y="18" width="10" height="18" fill="#2B2440"></rect>
<rect x="32" y="19" width="12" height="17" fill="#2B2440"></rect>
<rect x="42" y="15" width="8" height="21" fill="#2B2440"></rect>
<rect x="50" y="18" width="14" height="18" fill="#2B2440"></rect>
<rect x="0" y="26" width="64" height="10" fill="#1B1726"></rect>
<rect x="28" y="34" width="10" height="2" fill="#6B5A45"></rect>
<rect x="29" y="32" width="8" height="2" fill="#6B5A45"></rect>
<rect x="30" y="30" width="6" height="2" fill="#6B5A45"></rect>
<rect x="31" y="28" width="4" height="2" fill="#6B5A45"></rect>
<rect x="32" y="26" width="2" height="2" fill="#6B5A45"></rect>
<rect x="37" y="18" width="7" height="7" fill="#E8B44C" opacity="0.22"></rect>
<rect x="40" y="22" width="1" height="8" fill="#0E0C14"></rect>
<rect x="39" y="20" width="3" height="3" fill="#E8B44C"></rect>
</svg>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Pixelify Sans', monospace; font-size: 12px; letter-spacing: 1.5px; color: #E8B44C">CONTINUE</span>
<h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 500">The Lantern Road</h2>
<p style="margin: 0; font-size: 13px; color: #A79FB8">Scene 9 · 6 choices made · 3 notes</p>
</div>
<div role="img" aria-label="Progress: about half way" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px">
<sc-for list="{{segments}}" as="seg" hint-placeholder-count="10">
<div style="height: 8px; background: {{seg.fill}}"></div>
</sc-for>
</div>
<a href="Story.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; background: {{accent}}; color: #15131C; text-decoration: none; font-weight: 600; font-size: 16px; border-radius: 4px; box-shadow: 0 4px 0 #8A6420">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l12 8-12 8z"></path></svg>
Continue story
</a>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="Import.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; background: #201D29; border: 2px solid #3A3548; border-radius: 4px; color: #EDE8F5; text-decoration: none; font-weight: 500; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
Import story
</a>
<a href="Make.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; background: #201D29; border: 2px solid #3A3548; border-radius: 4px; color: #EDE8F5; text-decoration: none; font-weight: 500; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
Make a story
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h3 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 16px; font-weight: 500; letter-spacing: 1px">STORIES</h3>
<span style="font-size: 13px; color: #A79FB8">3 imported</span>
</div>
<sc-for list="{{stories}}" as="s" hint-placeholder-count="3">
<a href="StoryMenu.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px; background: #1C1925; border: 2px solid #2E2A3A; border-radius: 4px; color: #EDE8F5; text-decoration: none">
<span aria-hidden="true" style="width: 36px; height: 36px; flex: none; background: {{s.swatch}}; box-shadow: inset -6px -6px 0 rgba(0,0,0,0.25)"></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{s.title}}</span>
<span style="font-size: 12px; color: #A79FB8">{{s.meta}}</span>
</span>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; padding: 4px 8px; border-radius: 2px; color: {{s.tagColor}}; background: {{s.tagBg}}">{{s.tag}}</span>
</a>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h3 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 16px; font-weight: 500; letter-spacing: 1px">SAVED PATHS</h3>
<span style="font-size: 13px; color: #A79FB8">Tap to review</span>
</div>
<sc-for list="{{runs}}" as="r" hint-placeholder-count="2">
<a href="Review.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px; background: #1C1925; border: 2px solid #2E2A3A; border-radius: 4px; color: #EDE8F5; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8B44C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="6" cy="6" r="2"></circle><circle cx="18" cy="18" r="2"></circle><path d="M6 8v4a4 4 0 0 0 4 4h6"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-size: 14px; font-weight: 600">{{r.name}}</span>
<span style="font-size: 12px; color: #A79FB8">{{r.meta}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A79FB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
</a>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8B44C","options":["#E8B44C","#5CC8B4","#E2725B","#9D8CF0"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#E8B44C';
    return {
      accent,
      segments: Array.from({ length: 10 }, (_, i) => ({ fill: i < 5 ? accent : '#2E2A3A' })),
      stories: [
        { title: 'The Lantern Road', meta: 'by you · 62 scenes', tag: 'PLAYING', tagColor: '#E8B44C', tagBg: 'rgba(232,180,76,0.14)', swatch: '#4D3A63' },
        { title: 'Saltmarsh Wake', meta: 'by Dana R. · 40 scenes', tag: 'FINISHED', tagColor: '#5CC8B4', tagBg: 'rgba(92,200,180,0.14)', swatch: '#2C5A60' },
        { title: 'Bell of Hollowmere', meta: 'AI-generated · 87 scenes', tag: 'NEW', tagColor: '#E2725B', tagBg: 'rgba(226,114,91,0.14)', swatch: '#6B2E24' }
      ],
      runs: [
        { name: 'Saltmarsh — the drowned bell', meta: '14 choices · 6 notes · Nov 6' },
        { name: 'Saltmarsh — leave by dawn', meta: '9 choices · 2 notes · Nov 5' }
      ]
    };
  }
}
</script>
</body>
</html>
